name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EtykietyIT.slnx

      - name: Build
        run: dotnet build EtykietyIT.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EtykietyIT.slnx --configuration Release --no-build
